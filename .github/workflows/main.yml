name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm install

  test:
    runs-on: ubuntu-slim
    steps:
      - name: test
        run: echo "code is tested"

  deploy:
    runs-on: ubuntu-slime
    steps:
      - name: deploy
        run: echo "code is deployed"


