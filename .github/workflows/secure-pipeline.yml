    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: BUILD-JOB
    runs-on: ubuntu-slim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: echo "code build is done"
        
