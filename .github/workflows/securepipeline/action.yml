name: Secure DevSecOps Pipeline Steps

runs:
  using: 'composite'
  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Build
      run: npm install
      shell: bash

    - name: test
      run: echo "code is tested"
      shell: bash

    - name: deploy
      run: echo "code is deployed"
      shell: bash
